<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef8fb">
  <meta name="description" content="ANdamo, la mappa del trasporto pubblico di Ancona.">
  <title>ANdamo · Ancona</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar" id="topbar">
      <div class="brand-row">
        <div class="brand-mark">A</div>
        <div class="brand-copy"><strong>ANdamo</strong><span>Ancona, in movimento</span></div>
        <button class="icon-button" id="themeButton" aria-label="Cambia tema" title="Cambia tema">◐</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Cerca fermate o linee" aria-label="Cerca fermate o linee">
        <button id="clearSearch" class="clear-search" aria-label="Cancella ricerca" hidden>×</button>
      </div>
      <div id="searchResults" class="search-results" hidden></div>
    </header>

    <div id="map" aria-label="Mappa delle fermate del trasporto pubblico di Ancona"></div>

    <div class="map-status" id="mapStatus"><span class="status-dot"></span><span id="statusText">Caricamento fermate…</span></div>
    <button class="locate-button" id="locateButton" title="La mia posizione" aria-label="La mia posizione">◎</button>

    <section class="bottom-sheet" id="bottomSheet" aria-live="polite">
      <div class="sheet-handle"></div>
      <div id="sheetContent" class="sheet-content">
        <div class="sheet-intro">
          <span class="eyebrow">BENVENUTO SU ANDAMO</span>
          <h1>Muoviti ad Ancona.</h1>
          <p>Seleziona una fermata sulla mappa oppure cerca una linea.</p>
        </div>
      </div>
    </section>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigazione principale">
      <button class="nav-item active" data-tab="map"><span class="nav-symbol">⌖</span><span>Mappa</span></button>
      <button class="nav-item" data-tab="lines"><span class="nav-symbol">≋</span><span>Linee</span></button>
      <button class="nav-item" data-tab="favorites"><span class="nav-symbol">☆</span><span>Preferiti</span></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
